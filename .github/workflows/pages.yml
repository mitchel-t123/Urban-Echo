name: Test & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Playwright
        run: |
          npm install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium --with-deps
          else
            npx playwright install-deps chromium
          fi

      - name: JS syntax check (every page)
        run: python3 scripts/check-inline-js.py docs/*.html docs/*/index.html

      - name: Edge function checks (type-check and tests)
        run: bash scripts/test-edge-functions.sh

      - name: Smoke tests (portal buttons, onboarding flow, team admin)
        run: |
          python3 -m http.server 9876 --directory docs &
          sleep 2
          node scripts/portal-smoke.js
          node scripts/portal-flow-smoke.js
          node scripts/admin-smoke.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
